[build.environment]
  NODE_VERSION = "20"
  NODE_ENV = "production"

[build]
  command = "npm install --prefix backend --legacy-peer-deps && npm install --prefix frontend --include=dev --legacy-peer-deps && npm run build --prefix frontend"
  publish = "frontend/dist"

[functions]
  directory = "backend/src"
  node_bundler = "esbuild"
  external_node_modules = ["firebase-admin"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/lambda/api/:splat"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
